name: Deploy to Dev

on:
  push:
    branches:
      - beta

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  invoke-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890387921239:role/gh-dev-role
          aws-region: eu-east-1

      - name: Invoke Lambda
        run: |
          aws lambda invoke \
            --function-name mylambda \
            --payload '{}' \
            response.json
          cat response.json